<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- CLI Inspector — a shell prompt (>_) drawn as a neuron cloud.
       Palette matches the webview: #04060f ground, cyan synapses, glowing nodes. -->
  <defs>
    <radialGradient id="ground" cx="46%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#0e2247"/>
      <stop offset="55%" stop-color="#071129"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#1f8fff"/>
    </radialGradient>
    <radialGradient id="dim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9fd8ff"/>
      <stop offset="100%" stop-color="#2a63c0"/>
    </radialGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="5.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#ground)"/>

  <!-- faint dendrites drifting off the prompt; deliberately open, never a ring -->
  <g fill="none" stroke="#2f7fd8" stroke-linecap="round" filter="url(#softglow)" opacity=".5">
    <path d="M58 74 Q34 62 26 40" stroke-width="1.5"/>
    <path d="M58 74 Q30 96 30 124" stroke-width="1.4"/>
    <path d="M124 128 Q166 104 190 66" stroke-width="1.5"/>
    <path d="M190 66 Q216 60 228 38" stroke-width="1.3"/>
    <path d="M190 66 Q222 88 226 118" stroke-width="1.3"/>
    <path d="M58 182 Q40 206 46 228" stroke-width="1.4"/>
    <path d="M212 186 Q234 168 232 148" stroke-width="1.3"/>
  </g>

  <!-- the prompt: chevron + underscore, drawn as axons -->
  <g fill="none" stroke="#7df9ff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M58 74 L124 128 L58 182" stroke-width="13"/>
    <path d="M152 182 L212 182" stroke-width="13"/>
  </g>

  <!-- neuron bodies on the prompt -->
  <g filter="url(#glow)">
    <circle cx="124" cy="128" r="16" fill="url(#core)"/>
    <circle cx="58" cy="74" r="11.5" fill="url(#core)"/>
    <circle cx="58" cy="182" r="11.5" fill="url(#core)"/>
    <circle cx="152" cy="182" r="9.5" fill="url(#core)"/>
    <circle cx="212" cy="182" r="11.5" fill="url(#core)"/>
    <circle cx="91" cy="101" r="6" fill="#c9f5ff"/>
    <circle cx="91" cy="155" r="6" fill="#c9f5ff"/>
  </g>

  <!-- surrounding cloud nodes -->
  <g filter="url(#softglow)">
    <circle cx="190" cy="66" r="8" fill="url(#dim)"/>
    <circle cx="30" cy="124" r="6" fill="url(#dim)"/>
    <circle cx="26" cy="40" r="4.5" fill="url(#dim)"/>
    <circle cx="228" cy="38" r="4" fill="url(#dim)"/>
    <circle cx="226" cy="118" r="5.5" fill="url(#dim)"/>
    <circle cx="46" cy="228" r="5" fill="url(#dim)"/>
    <circle cx="232" cy="148" r="4.5" fill="url(#dim)"/>
  </g>
</svg>
